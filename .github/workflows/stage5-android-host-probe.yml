      - name: Fresh isolated guest and synthetic ARM64 JNI execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          printf 'no\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd -n stage5_empty -k 'system-images;android-30;google_apis;x86_64'
          cat >> "$ANDROID_AVD_HOME/stage5_empty.avd/config.ini" <<'EOF'
          hw.ramSize=1536
          hw.cpu.ncore=2
          hw.lcd.width=480
          hw.lcd.height=800
          hw.lcd.density=160
          disk.dataPartition.size=1073741824
          EOF
          cat > "$PROBE_ROOT/boot.sh" <<'EOF'
          set -euo pipefail
          test "$(id -u)" -ne 0
          ip -j link | python3 -c 'import sys,json; assert [x["ifname"] for x in json.load(sys.stdin)]==["lo"]'
          test -z "$(ip route show)"
          test -z "$(ip -6 route show default)"
          ip -br addr
          export HOME="$PROBE_ROOT/home"
          mkdir -m 700 "$HOME"
          export ANDROID_I_WANT_MY_TCG=yes
          unset ADB_SERVER_SOCKET
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          emulator="$ANDROID_SDK_ROOT/emulator/emulator"
          "$adb" -P 5037 start-server
          export ADB_SERVER_SOCKET=tcp:127.0.0.1:5037
          "$emulator" @stage5_empty -accel off -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -wipe-data -no-boot-anim -no-metrics -port 5554 -memory 1536 -cores 2 > "$PROBE_ROOT/emulator.log" 2>&1 &
          pid=$!
          finish() {
            rc=$?
            trap - EXIT
            if (( rc != 0 )); then
              echo "RUNTIME_FAILURE_EXIT=$rc"
              timeout 20 "$adb" -s emulator-5554 shell getprop sys.boot_completed || true
              timeout 20 "$adb" -s emulator-5554 shell service check package || true
              timeout 20 "$adb" -s emulator-5554 shell pidof system_server || true
              timeout 30 "$adb" -s emulator-5554 logcat -b all -d -t 300 || true
            fi
            kill "$pid" 2>/dev/null || true
            timeout 20 "$adb" kill-server || true
            tail -80 "$PROBE_ROOT/emulator.log" || true
            exit "$rc"
          }
          trap finish EXIT
          for i in $(seq 1 64); do
            kill -0 "$pid" 2>/dev/null || { echo "emulator exited"; exit 1; }
            if test "$(timeout 8 "$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1; then
              "$adb" -s emulator-5554 shell getprop ro.build.version.sdk
              "$adb" -s emulator-5554 shell getprop ro.product.cpu.abilist
              "$adb" -s emulator-5554 shell getprop ro.dalvik.vm.native.bridge
              "$adb" -s emulator-5554 shell pm list packages -3
              test "$(timeout 30 "$adb" -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')" = 30
              timeout 30 "$adb" -s emulator-5554 shell getprop ro.product.cpu.abilist | tr -d '\r' | grep -Eq '(^|,)arm64-v8a(,|$)'
              test "$(timeout 30 "$adb" -s emulator-5554 shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')" = libndk_translation.so
              test -z "$(timeout 30 "$adb" -s emulator-5554 shell pm list packages -3 | tr -d '\r')"
              echo 'SOFTWARE_BOOT_PASS__EMPTY_GUEST_ONLY'
              # Require three consecutive successful real package-manager queries with a stable system_server PID.
              stable=0
              previous_pid=""
              for attempt in $(seq 1 12); do
                kill -0 "$pid"
                if service="$(timeout 30 "$adb" -s emulator-5554 shell service check package 2>&1)" &&
                   [[ "$(printf '%s' "$service" | tr -d '\r')" == 'Service package: found' ]] &&
                   current_pid="$(timeout 30 "$adb" -s emulator-5554 shell pidof system_server | tr -d '\r')" &&
                   [[ "$current_pid" =~ ^[0-9]+$ ]] &&
                   path_result="$(timeout 45 "$adb" -s emulator-5554 shell cmd package path android 2>&1)" &&
                   [[ "$(printf '%s' "$path_result" | tr -d '\r')" == 'package:/system/framework/framework-res.apk' ]]; then
                  if [[ "$previous_pid" == "$current_pid" ]]; then
                    stable=$((stable + 1))
                  else
                    stable=1
                  fi
                  previous_pid="$current_pid"
                  echo "PACKAGE_SERVICE_SAMPLE=$attempt STABLE=$stable SYSTEM_SERVER_PID=$current_pid"
                  if (( stable >= 3 )); then break; fi
                else
                  echo "PACKAGE_SERVICE_NOT_READY_SAMPLE=$attempt"
                  stable=0
                  previous_pid=""
                fi
                sleep 10
              done
              if (( stable < 3 )); then
                echo 'PACKAGE_SERVICE_READINESS_HOLD'
                exit 1
              fi
              echo 'PACKAGE_SERVICE_READINESS_PASS'
              # ADB's documented non-streaming mode pushes the APK before package installation.
              if ! timeout 240 "$adb" -s emulator-5554 install --no-streaming "$PROBE_ROOT/fixture-signed.apk" > "$PROBE_ROOT/install.log" 2>&1; then
                cat "$PROBE_ROOT/install.log"
                echo 'NON_STREAMING_INSTALL_HOLD'
                exit 1
              fi
              cat "$PROBE_ROOT/install.log"
              tr -d '\r' < "$PROBE_ROOT/install.log" | grep -Fx Success
              timeout 45 "$adb" -s emulator-5554 shell pm path org.ffbeprobe.arm64 | tr -d '\r' | grep -E '^package:/data/app/.*/base\.apk$'
              echo 'SYNTHETIC_APK_INSTALL_PASS'
              timeout 30 "$adb" -s emulator-5554 logcat -c
              timeout 180 "$adb" -s emulator-5554 shell am start -W -n org.ffbeprobe.arm64/.ProbeActivity
              for n in $(seq 1 12); do
                app_pid="$(timeout 20 "$adb" -s emulator-5554 shell pidof org.ffbeprobe.arm64 | tr -d '\r' || true)"
                if [[ "$app_pid" =~ ^[0-9]+$ ]]; then
                  timeout 30 "$adb" -s emulator-5554 logcat -d --pid="$app_pid" -s FFBE_ARM64_FIXTURE:I '*:S' > "$PROBE_ROOT/fixture.log"
                  timeout 30 "$adb" -s emulator-5554 shell dumpsys activity activities > "$PROBE_ROOT/activity.log"
                  if grep -F 'ARM64_JNI_EXECUTION_PASS_13572468' "$PROBE_ROOT/fixture.log" && grep -E 'mResumedActivity:.*org\.ffbeprobe\.arm64/\.ProbeActivity' "$PROBE_ROOT/activity.log"; then
                    echo 'SYNTHETIC_ARM64_JNI_RUNTIME_PASS__NO_FFBE_APPROVAL'
                    timeout 60 "$adb" -s emulator-5554 uninstall org.ffbeprobe.arm64 | grep -Fx Success
                    exit 0
                  fi
                fi
                sleep 5
              done
              echo 'SYNTHETIC_ARM64_JNI_RUNTIME_HOLD'
              exit 1
            fi
            sleep 5
          done
          echo 'SOFTWARE_BOOT_TIMEOUT__NO_APPROVAL'
          exit 1
          EOF
          # Create disconnected network namespace with host privilege, then drop privilege before launching guest.
          runner_user="$(id -un)"
          bash -n "$PROBE_ROOT/boot.sh"
          sudo timeout 1560 unshare --net bash -c 'set -euo pipefail; ip link set lo up; exec runuser -u "$1" -- env ANDROID_SDK_ROOT="$2" ANDROID_HOME="$2" PROBE_ROOT="$3" ANDROID_AVD_HOME="$4" ANDROID_USER_HOME="$5" bash "$3/boot.sh"' _ "$runner_user" "$ANDROID_SDK_ROOT" "$PROBE_ROOT" "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"

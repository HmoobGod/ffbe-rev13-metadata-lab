name: FFBE synthetic artifact delivery probe

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ffbe-artifact-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create tiny synthetic JSON
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema":1,"kind":"ffbe-synthetic-probe","resource_bytes":0}' > "$RUNNER_TEMP/probe.json"
          test "$(wc -c < "$RUNNER_TEMP/probe.json")" -le 256
          sha256sum "$RUNNER_TEMP/probe.json"

      - name: Test artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: ffbe-artifact-probe
          path: ${{ runner.temp }}/probe.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
